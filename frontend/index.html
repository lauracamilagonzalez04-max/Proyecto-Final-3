<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Sneakers</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
    <div class="logo">
        <h1>Urban Sneakers</h1>
    </div>

    <nav>
        <button onclick="mostrarVista('inicio')">Inicio</button>
        <button onclick="mostrarVista('productos')">Productos</button>
        <button onclick="mostrarVista('login')">Login</button>
    </nav>
</header>

<!-- INICIO -->
<section id="inicio" class="vista activa">

    <div class="hero">
        <h2>La mejor tienda de sneakers</h2>
        <p>Encuentra los tenis más exclusivos del mercado</p>
    </div>

</section>

<!-- PRODUCTOS -->
<section id="productos" class="vista oculto">

    <h2>Nuestros Productos</h2>

    <div class="contenedor-productos">

        <div class="card">
            <img src="img/teni1.jpg" alt="Nike">
            <h3>Nike Air Max</h3>
            <p>$250</p>
            <button onclick="agregarCarrito('Nike Air Max',250)">Agregar</button>
        </div>

        <div class="card">
            <img src="img/teni2.jpg" alt="Adidas">
            <h3>Adidas Campus</h3>
            <p>$300</p>
            <button onclick="agregarCarrito('Adidas Campus',300)">Agregar</button>
        </div>

        <div class="card">
            <img src="img/teni3.jpg" alt="Puma">
            <h3>Puma Street</h3>
            <p>$200</p>
            <button onclick="agregarCarrito('Puma Street',200)">Agregar</button>
        </div>

    </div>
        </div>

    <div class="carrito">
        <h3>Carrito</h3>
        <ul id="listaCarrito"></ul>
    </div>

</section>

<!-- LOGIN -->
<section id="login" class="vista oculto">

    <div class="login-box">

        <h2>Iniciar Sesión</h2>

        <input type="email" id="correo" placeholder="Correo electrónico">

        <input type="password" id="password" placeholder="Contraseña">

        <button onclick="iniciarSesion()">Ingresar</button>

    </div>

</section>

<footer>
    <p>Urban Sneakers 2026</p>
</footer>

<script src="js/app.js"></script>

</body>
</html>
